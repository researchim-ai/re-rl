"kind": "text", "domain": "Дискретная математика", "subtypes": ["value", "term"], "summary": "числа менáжа.", "example": "Число менáжа порядка 4. Для k от 0 до 4 слагаемое равно (-1)^k * 2*4*(2*4-k-1)!*( 4-k)! / (k!*(2*4-2*k)!). Деление целое. Какова сумма слагаемых?", "answer": "2", "error": ""}, {"id": "min_assignment", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["cost", "job"], "summary": "задача о назначениях.", "example": "Квадрат стоимостей, строка — работник, столбец — работа, номера с 1: 1: 4 9 3; 2: 6 8 2; 3: 1 8 5. Каждый работник получает одну работу, каждая работа достаётся одному. Среди назначений минимальной стоимости берётся лексикографически первая последовательность работ. Найдите минимальную стоимость.", "answer": "12", "error": ""}, {"id": "min_coins", "kind": "text", "domain": "Дискретная математика", "subtypes": ["min_count"], "summary": "минимальное число монет для суммы.", "example": "Монеты номиналов 1, 5, каждого номинала сколько угодно. Какое минимальное число монет нужно, чтобы набрать сумму 12?", "answer": "4", "error": ""}, {"id": "min_hold", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["low", "popped"], "summary": "стек и минимум лежащих чисел.", "example": "Стек пуст. Команд 4, в каждой код и число: 0 9, 0 6, 1 0, 0 1. Код 0 кладёт число наверх. Код 1 снимает верхнее число, если стек не пуст. Снятие с пустого стека ничего не делает, а его число не используется. Каков минимум чисел, которые сейчас лежат в стеке? Если стек пуст, ответ 0.", "answer": "1", "error": ""}, {"id": "min_path_sum", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["sum"], "summary": "минимальная сумма пути по сетке только вправо и вниз.", "example": "Сетка, строки разделены знаком / : 4 3 6 / 8 2 1. Идти можно только вправо и вниз, из левого верхнего угла в правый нижний. Найдите минимальную сумму клеток на пути.", "answer": "10", "error": ""}, {"id": "min_squares", "kind": "text", "domain": "Дискретная математика", "subtypes": ["count"], "summary": "минимум квадратов натуральных чисел с суммой n.", "example": "Какое наименьшее число квадратов натуральных чисел в сумме даёт 16? Единица тоже квадрат, повторы разрешены.", "answer": "1", "error": ""}, {"id": "minesweeper_deduction", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "логический вывод в стиле «Сапёра».", "example": "Поле «Сапёра» 3×3. Числа — количество мин среди 8 соседей клетки, «?» — скрытая клетка. Целевая клетка отмечена «?*» (строка 2, столбец 1). 1 2 ? ?* 3 ? ? ? 1 Является ли целевая клетка миной? Ответьте «мина» или «безопасно».", "answer": "мина", "error": ""}, {"id": "minesweeper_image", "kind": "visual", "domain": "Визуальные", "subtypes": [], "summary": "Визуальный вариант «Сапёра»: поле рисуется как картинка (PIL).", "example": "На рисунке — поле «Сапёра» 3×3. Числа в открытых клетках — сколько мин среди 8 соседей; серые клетки со знаком «?» скрыты. Целевая клетка обведена красным (строка 2, столбец 1). Является ли она миной? Ответьте «мина» или «безопасно».", "answer": "мина", "error": ""}, {"id": "minimax_tree", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["value", "action"], "summary": "значение и ход в дереве максимума и минимума.", "example": "Корень максимизирует. Каждый ход ведёт к узлу, который берёт минимум своих листьев. При равенстве у корня выбирается меньший номер хода. Ход 1, листья минимума: 3 2. Ход 2, листья минимума: -1 3. Ход 3, листья минимума: 4 3 -5. Найдите оценку корня.", "answer": "2", "error": ""}, {"id": "minute_add", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["minute", "carries"], "summary": "прибавление минут с переносом часа.", "example": "Сейчас 7 часов и 37 минут. Прибавлений 4: 70, 17, 48, 78. Каждые 60 минут дают один час, а час после 23 снова становится 0. Каково число минут в конце, от 0 до 59?", "answer": "10", "error": ""}, {"id": "mirror_fault", "kind": "visual", "domain": "Визуальные", "subtypes": ["pairs", "rows"], "summary": "пары клеток, которые ломают зеркальную симметрию.", "example": "На картинке квадратная сетка. Тёмная клетка и светлая различаются. Ось симметрии вертикальная. Сравните клетки, которые стоят на одном расстоянии от левого и от правого края. Средняя клетка при нечётном числе столбцов пары не имеет. Сколько таких пар не совпало?", "answer": "7", "error": ""}, {"id": "mirror_glance", "kind": "text", "domain": "Волны и оптика", "subtypes": ["glance", "deviation"], "summary": "угол отражения от плоского зеркала.", "example": "Луч падает на плоское зеркало под углом 16° к нормали. Под каким углом к поверхности зеркала идёт отражённый луч?", "answer": "74", "error": ""}, {"id": "mirror_ray", "kind": "visual", "domain": "Визуальные", "subtypes": ["hits", "side"], "summary": "луч среди двух видов зеркал.", "example": "На картинке сетка. Зелёная стрелка показывает клетку, в которую луч входит, и направление направо. Черта из левого верхнего угла клетки в правый нижний — одно зеркало. Черта из левого нижнего угла в правый верхний — другое. Луч направо первое зеркало поворачивает вниз, второе — вверх. Луч вниз первое поворачивает направо, второе — налево. Луч налево первое поворачивает вверх, второе — вниз. Луч вверх первое поворачивает налево, второе — направо. Пустая клетка направление не меняет. Сколько зеркал луч заденет до выхода из сетки?", "answer": "1", "error": ""}, {"id": "mix_chain", "kind": "text", "domain": "Прикладная математика", "subtypes": ["final"], "summary": "несколько замен части раствора.", "example": "В сосуде 6 л раствора концентрации 75%. Выполняют 3 замен, объём не меняется. 1) отлили 2 л и долили 69%. 2) отлили 1 л и долили 13%. 3) отлили 2 л и долили 90%. Какова итоговая концентрация в процентах?", "answer": "72", "error": ""}, {"id": "mix_count", "kind": "text", "domain": "Вероятность", "subtypes": ["exact", "peak"], "summary": "вес числа успехов у испытаний с разными весами.", "example": "Независимых испытаний 4. У каждого два целых веса: неуспех и успех. Пары весов: 1 3; 3 1; 2 3; 2 3. Сначала вес 1 стоит при нуле успехов. Испытание умножает каждый уже полученный вес на вес неуспеха, сохраняя число успехов, и на вес успеха, увеличивая это число на 1. Чему равен суммарный вес исходов ровно с 2 успехами?", "answer": "159", "error": ""}, {"id": "mixed_nash", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["row", "column"], "summary": "внутреннее смешанное равновесие игры 2×2.", "example": "Игра 2×2. Выплаты строки: верх-лево -1, верх-право 1, низ-лево 1, низ-право 0. Выплаты столбца: верх-лево 1, верх-право -2, низ-лево -1, низ-право 2. p — вероятность верхней строки, делающая столбца безразличным: p = (низ-право - низ-лево) / (верх-лево - низ-лево - верх-право + низ-право) по выплатам столбца. q — вероятность левого столбца, делающая строку безразличной: q = (низ-право - верх-право) / (верх-лево - верх-право - низ-лево + низ-право) по выплатам строки. Ответ — целое или несократимая дробь. Найдите p.", "answer": "1/2", "error": ""}, {"id": "mixture_concentration", "kind": "text", "domain": "Прикладная математика", "subtypes": ["result", "second"], "summary": "концентрация смеси двух растворов.", "example": "Смешали 1 л раствора с концентрацией 99% и 5 л раствора с концентрацией 3%. Какова концентрация смеси в процентах?", "answer": "19", "error": ""}, {"id": "mobile_torque", "kind": "text", "domain": "Механика", "subtypes": ["hidden", "load"], "summary": "подвес, в котором каждый стержень уравновешен.", "example": "Подвес из стержней без собственной массы. Гиря 1 весит 2. Гиря 2 весит 4. Гиря 3 неизвестна. Стержень 1: плечо 1 к гире 2, плечо 4 к гире 3. Стержень 2: плечо 5 к гире 1, плечо 2 к стержню 1. На каждом стержне левое плечо, умноженное на левую массу, равно правому плечу, умноженному на правую массу. Найдите массу гири 3.", "answer": "1", "error": ""}, {"id": "mobius_sum", "kind": "text", "domain": "Дискретная математика", "subtypes": ["sum", "mu"], "summary": "функция Мёбиуса и её частичные суммы.", "example": "Функция Мёбиуса: 0, если число делится на квадрат простого. Иначе это минус единица в степени числа различных простых множителей. Для 1 значение равно 1. Какова сумма значений от 1 до 6?", "answer": "-1", "error": ""}, {"id": "mod_accum", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["value", "zeros"], "summary": "сложение, вычитание и умножение по модулю 10.", "example": "Число начинает с 3. Операций 4, в каждой код и число: 2 4; 0 2; 2 3; 2 4. Код 0 прибавляет, код 1 вычитает, код 2 умножает. После операции берётся неотрицательный остаток от деления на 10, от 0 до 10 минус 1. Каково число в конце?", "answer": "8", "error": ""}, {"id": "mod_chain", "kind": "text", "domain": "Дискретная математика", "subtypes": ["final"], "summary": "цепочка x → (a·x + b) mod m.", "example": "Начальное значение x = 3, модуль 8. Выполняют 3 замен. 1) x → x·2+5. 2) x → x·7+1. 3) x → x·0+7. Чему равен x?", "answer": "7", "error": ""}, {"id": "mod_order", "kind": "text", "domain": "Дискретная математика", "subtypes": ["order", "power"], "summary": "порядок основания по модулю.", "example": "Основание 5, модуль 6. Степень начинает с 1. Каждый из 5 шагов умножает её на основание и берёт остаток по модулю. На каком шаге остаток впервые равен 1?", "answer": "2", "error": ""}, {"id": "mod_poly", "kind": "text", "domain": "Абстрактная алгебра", "subtypes": ["coeff", "total"], "summary": "произведение в кольце многочленов над полем вычетов.", "example": "Многочлены над полем вычетов по простому модулю 3. Коэффициенты идут от свободного члена к старшей степени. Первый, коэффициентов 4: 2 2 0 1. Второй: 2 1. Коэффициент степени k в произведении равен сумме произведений коэффициентов, чьи степени в сумме дают k, по модулю 3. Свободный член имеет степень 0. Каков коэффициент степени 4?", "answer": "1", "error": ""}, {"id": "mode_track", "kind": "text", "domain": "Вероятность", "subtypes": ["mode", "switches"], "summary": "мода потока чисел.", "example": "Числа приходят по порядку, всего 4: 1, 1, 2, 3. Мода — значение, которое встречалось чаще всего. Если таких значений несколько, берётся меньшее. Какова мода в конце?", "answer": "1", "error": ""}, {"id": "model_counting", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Формальная логика: классификация формул, подсчёт моделей, 3-SAT,", "example": "Сколько наборов значений переменных p, q, r делают формулу истинной? (((q ↔ r) ∧ (p ↔ q)) ∧ p)", "answer": "1", "error": ""}, {"id": "modular_arithmetic", "kind": "text", "domain": "Дискретная математика", "subtypes": [], "summary": "модульное возведение в степень и дискретный логарифм.", "example": "Вычислите 5^11 mod 37.", "answer": "2", "error": ""}, {"id": "modular_inverse", "kind": "text", "domain": "Дискретная математика", "subtypes": [], "summary": "обратный элемент по модулю (расширенный Евклид).", "example": "Найдите обратный элемент к 11 по модулю 12: число x из диапазона 0..11, для которого 11·x ≡ 1 (mod 12).", "answer": "11", "error": ""}, {"id": "momentum", "kind": "text", "domain": "Механика", "subtypes": ["momentum", "impulse", "inelastic_collision", "elastic_collision"], "summary": "задачи на импульс и столкновения.", "example": "Найдите импульс тела массой 8 кг, движущегося со скоростью 9 м/с.", "answer": "72 кг·м/с", "error": ""}, {"id": "momentum_sgd", "kind": "text", "domain": "Машинное обучение", "subtypes": ["weight", "velocity"], "summary": "шаг импульса с целочисленным затуханием.", "example": "Вес начинается с -1, скорость с 0. Дальше 3 градиентов: 4, -2, 1. На шаге скорость делится пополам с округлением вниз и к ней прибавляется градиент, затем вес уменьшается на скорость. Какой вес получится?", "answer": "-6", "error": ""}, {"id": "monty_hall", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Разные логические задачи: расшифровка шифра (Цезарь / подстановка), принцип", "example": "Классическая задача Монти Холла: 3 двери, за одной автомобиль, за двумя — козы. Вы выбираете дверь, ведущий (знающий, где приз) открывает одну из оставшихся дверей с козой. Какова вероятность выиграть автомобиль, если переключиться? Ответьте дробью.", "answer": "2/3", "error": ""}, {"id": "moore_run", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["total", "last"], "summary": "сумма чисел, которые печатает автомат Мура.", "example": "Автомат Мура. Состояний 4, старт в 0. Печать записана как состояние, двоеточие и число: 0: 1; 1: 4; 2: 4; 3: 1. У стрелки перед двоеточием стоят состояние и символ, после двоеточия — одно следующее состояние. Стрелки: 0,0: 2; 0,1: 3; 1,0: 0; 1,1: 0; 2,0: 3; 2,1: 2; 3,0: 1; 3,1: 1. Слово из 4 символов: 1, 1, 1, 0. Сумма включает число стартового состояния ещё до первого символа. Какова сумма напечатанных чисел?", "answer": "11", "error": ""}, {"id": "morton_code", "kind": "text", "domain": "Дискретная математика", "subtypes": ["code", "bit"], "summary": "код Мортона, чередование битов двух чисел.", "example": "Числа x = 3 и y = 2 записаны 3 битами, недостающие старшие биты — нули. Код строится от старшего бита к младшему: на каждом разряде сначала берётся бит y, затем бит x. Каков полученный код?", "answer": "13", "error": ""}, {"id": "motion_segments", "kind": "text", "domain": "Механика", "subtypes": ["place", "speed"], "summary": "разгон и торможение по участкам.", "example": "Тело стартует из покоя в точке 0. Дальше 3 участков с постоянным ускорением. Запись — ускорение и чётное время в секундах: -2, 2; -1, 4; 2, 2. Скорость в конце участка равна скорости в начале плюс ускорение, умноженное на время. Координата прибавляет скорость в начале, умноженную на время, и половину ускорения, умноженного на квадрат времени. Какова конечная координата?", "answer": "-40", "error": ""}, {"id": "motzkin_row", "kind": "text", "domain": "Дискретная математика", "subtypes": ["value", "numer"], "summary": "числа Моцкина по двучленной рекурсии.", "example": "Числа Моцкина: M(0) = 1, M(1) = 1. Дальше числитель (2*n+1)*M(n-1) + (3*n-3)*M(n-2) делится на n+2 нацело. Каково M(4)?", "answer": "9", "error": ""}, {"id": "mse_loss", "kind": "text", "domain": "Машинное обучение", "subtypes": ["mse", "sse"], "summary": "среднеквадратичная ошибка регрессии и сумма квадратов.", "example": "Прогнозы: -2, 4, 3. Истинные значения: -3, 0, 4. Среднеквадратичная ошибка — среднее квадратов разностей. Найдите её. Ответ — целое или несократимая дробь.", "answer": "6", "error": ""}, {"id": "mst_image", "kind": "visual", "domain": "Визуальные", "subtypes": [], "summary": "Визуальные варианты графовых задач: граф рисуется через networkx, а логика и", "example": "На рисунке — взвешенный связный граф (числа на рёбрах — веса). Найдите суммарный вес минимального остовного дерева.", "answer": "23", "error": ""}, {"id": "mst_weight", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Графовые алгоритмы как задачи с пошаговым решением.", "example": "Взвешенный связный граф (вершины 0..4). Рёбра: (2-0, вес 10), (3-0, вес 8), (4-2, вес 9), (1-2, вес 4), (3-4, вес 7), (1-4, вес 11), (1-3, вес 12), (0-4, вес 3). Найдите суммарный вес минимального остовного дерева.", "answer": "23", "error": ""}, {"id": "mtf_list", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["cost", "place"], "summary": "перенос запрошенного номера в начало списка.", "example": "В списке 4 номеров, сначала они стоят по возрастанию от 0. Запросов 4: 1, 1, 2, 3. Цена запроса — его место до переноса, считая с 0. После запроса номер переносится в начало, остальные сдвигаются вправо. Какова сумма цен?", "answer": "6", "error": ""}, {"id": "mux_index", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["index", "value"], "summary": "выбор значения битами адреса.", "example": "Адрес из 3 битов читается слева направо, старший бит первый: 0, 0, 1. Начните с 0 и для каждого бита удвойте адрес и прибавьте бит. Таблица значений с индекса 0: 9, 7, 9, 1, 9, 0, 7, 4. Каков адре проса (1, 1)? Ответьте A или B.", "answer": "A", "error": ""}, {"id": "naive_find", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["index", "checks"], "summary": "наивный поиск образца и число сравнений символов.", "example": "Текст 0011, образец 00. Образец прикладывается к тексту 3 раз, сдвигаясь на один символ. На каждом прикладывании символы сравниваются слева, пока образец не кончится или символы не разойдутся. Какова позиция первого полного совпадения? Позиции текста нумеруются с 1. Если совпадения нет, ответ 0.", "answer": "1", "error": ""}, {"id": "narayana_row", "kind": "text", "domain": "Дискретная математика", "subtypes": ["entry", "total"], "summary": "числа Нараяны одной строки.", "example": "Числа Нараяны порядка 4. Для k от 1 до 4 значение равно C(4, k)*C(4, k-1)/4. Коэффициент C(a, b) — произведение (a-b+i)/i по i от 1 до b. Деление целое. Каково значение при k = 2?", "answer": "6", "error": ""}, {"id": "natural_deduction", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Проверка корректности пропозиционального вывода (natural deduction).", "example": "Дан пропозициональный вывод. Правила: MP (из A и A→B следует B), MT (из A→B и ¬B следует ¬A), ∧-введение (из A и B следует A∧B), ∧-удаление (из A∧B следует A или B). Каждая строка ссылается на номера предыдущих строк. 1. (q → t) [посылка] 2. (s ∧ r) [посылка] 3. (t → s) [посылка] 4. q [посылка] 5. (r → q) [посылка] 6. ¬t [посылка] 7. ¬q [MT: 6, 1] 8. ¬r [MT: 7, 5] 9. t [MP: 4, 1] Корректен ли вывод (каждый шаг верно применяет своё правило)? Ответьте да/нет.", "answer": "да", "error": ""}, {"id": "necklace_count", "kind": "text", "domain": "Дискретная математика", "subtypes": ["count", "power"], "summary": "ожерелья из двух цветов при простом числе бусин.", "example": "Ожерелье из 7 бусин, 7 простое, каждая бусина одного из двух цветов. Два ожерелья одинаковы, если одно получается из другого поворотом. Их число равно (2^7 + (7-1)*2) / 7, и деление целое. Начните ain": "Волны и оптика", "subtypes": ["snell", "critical_angle", "thin_lens", "magnification", "mirror"], "summary": "задачи по оптике.", "example": "Луч света падает из среды с показателем преломления 1.24 в среду с 1.54 под углом 33°. Найдите угол преломления.", "answer": "26.01°", "error": ""}, {"id": "optimal_bst", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["cost"], "summary": "минимальная стоимость дерева поиска.", "example": "Ключи уже упорядочены. Их частоты слева направо: 2 5 5 2. Корень дерева имеет глубину 1, дети корня — глубину 2 и так далее. Стоимость дерева — сумма частот, умноженных на глубину ключа. Найдите минимальную стоимость.", "answer": "25", "error": ""}, {"id": "optimization", "kind": "text", "domain": "Анализ", "subtypes": ["find_extremum", "max_min_interval", "linear_programming"], "summary": "задачи на оптимизацию.", "example": "Найдите экстремумы функции: f(x) = -3x^3 + 8x^2 + 7x - 6", "answer": "Требуется численное решение", "error": ""}, {"id": "option_hold", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["tick", "total"], "summary": "действие опции держится указанное число тактов.", "example": "Опций 4, запись — действие и сколько тактов его держать: 2, 1; 3, 1; 1, 1; 4, 1. Опции идут по порядку, действие не меняется, пока его такты не кончатся. Какое действие на такте 2? Нумерация тактов с 1.", "answer": "3", "error": ""}, {"id": "orbit_years", "kind": "text", "domain": "Астрофизика", "subtypes": ["period", "years"], "summary": "периоды планет при целых радиусах орбиты.", "example": "Планет 4. Радиусное число каждой, по порядку: 1, 2, 5, 5. Период равен этому числу в кубе. Каков период планеты 2?", "answer": "8", "error": ""}, {"id": "ordering_puzzle", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "дедукция полного порядка из подсказок.", "example": "4 человек стоят в ряд на позициях с 1 по 4: Анна, Борис, Вера, Глеб. Подсказки: - Глеб is immediately before Анна. - Борис ка 0 треугольника Паскаля состоит из числа 1. Каждая следующая строка получается сложением соседних чисел предыдущей, а по краям ставятся единицы. Чему равен элемент номер 2 в строке 4? Нумерация в строке начинается с 1.", "answer": "4", "error": ""}, {"id": "pascal_vec", "kind": "text", "domain": "Линейная алгебра", "subtypes": ["last", "total"], "summary": "умножение вектора на матрицу Паскаля.", "example": "Вектор длины 4, нумерация с нуля: -2 1 1 -2. Нижняя треугольная матрица Паскаля в строке k и столбце j содержит биномиальный коэффициент, если j не больше k, и ноль иначе. Образ в позиции k — сумма по j от нуля до k биномиального коэффициента строки k по столбцу j, умноженного на координату j. Обратная матрица берёт тот же коэффициент со знаком плюс, когда k минус j чётно, и со знаком минус, когда k минус j нечётно. Умножение образа на обратную матрицу возвращает исходную координату. Чему равен последний образ?", "answer": "2", "error": ""}, {"id": "path_amp", "kind": "text", "domain": "Квантовая физика", "subtypes": ["amplitude", "chance"], "summary": "сумма амплитуд путей и квадрат этой суммы.", "example": "Путей 4, их амплитуды: -1 -1 1 1. Каждая амплитуда равна 1 или -1. Полная амплитуда — сумма амплитуд. Вероятность в выбранных единицах — квадрат полной амплитуды. Какова полная амплитуда?", "answer": "0", "error": ""}, {"id": "path_green", "kind": "text", "domain": "Электричество", "subtypes": ["peak", "total"], "summary": "потенциал единичного источника на отрезке с нулевыми концами.", "example": "Узлы занумерованы от 0 до 5. Потенциал в концах 0. Источник стоит в узле 2, внутренних узлов 4. В узле i, если i не больше номера источника, потенциал равен i, умноженному на (5 минус номер источника). Если i больше, потенциал равен номеру источника, умноженному на (5 минус i). Левый сосед минус удвоенный узел плюс правый сосед равен нулю везде, кроме источника, где эта разность равна минус 5. Чему равен потенциал в узле источника?", "answer": "6", "error": ""} ": "Если y * (w1*x1 + w2*x2 + b) <= 0, то w1 := w1 + y*x1, w2 := w2 + y*x2, b := b + y. Иначе веса не меняются. Начальные веса w1 = 0, w2 = 1, b = 0. Примеры (x1, x2, y): (-1, 2, y=-1). Какие веса получатся после обработки примеров по порядку? Ответьте тремя числами: w1, w2, b.", "answer": "1, -1, -1", "error": ""}, {"id": "perm_compose", "kind": "text", "domain": "Дискретная математика", "subtypes": ["image", "sign"], "summary": "композиция подстановок.", "example": "Есть 3 подстановок чисел от 1 до 4. Запись — образы 1, 2 и дальше по порядку: 4 1 3 2; 1 2 4 3; 2 4 3 1. Сначала применяется первая подстановка, затем вторая и так далее. Куда переходит число 4?", "answer": "4", "error": ""}, {"id": "perm_conj", "kind": "text", "domain": "Абстрактная алгебра", "subtypes": ["image", "fixed"], "summary": "сопряжение подстановок.", "example": "Две подстановки чисел от 1 до 4. Сигма, образы по порядку: 4 1 3 2. Тау, образы по порядку: 1 2 4 3. Сопряжённая подстановка переводит сигма от x в сигма от тау от x. Чтобы найти образ числа y, возьмите его прообраз по сигме, примените тау, затем сигму. Куда сопряжённая подстановка переводит 1?", "answer": "1", "error": ""}, {"id": "perm_order", "kind": "text", "domain": "Абстрактная алгебра", "subtypes": ["order", "moved"], "summary": "порядок подстановки как наименьшее общее кратное циклов.", "example": "Подстановка чисел от 1 до 4. Образы по порядку: 4 1 3 2. Цикл числа — повторное применение подстановки, пока не вернётесь в это число. Длина неподвижной точки равна 1. Если число уже встретилось в предыдущем цикле, новый цикл не открывается. Порядок подстановки — наименьшее общее кратное длин всех циклов. Каков порядок?", "answer": "3", "error": ""}, {"id": "perm_rank", "kind": "text", "domain": "Дискретная математика", "subtypes": ["rank", "digit"], "summary": "ранг перестановки в факториальной системе.", "example": "Перестановка чисел от 1 до 4: 4 1 3 2. Идём слева направо. Цифра кода — сколько ещё не вычеркнутых чисел меньше те "interior"], "summary": "формула Пика.", "example": "Формула Пика: площадь = I + B/2 - 1. Ответ — целое или несократимая дробь. Внутри многоугольника I = 3 узлов решётки, на границе B = 12. Найдите площадь.", "answer": "8", "error": ""}, {"id": "pid_track", "kind": "text", "domain": "Механика", "subtypes": ["place", "memory"], "summary": "дискретный регулятор положения по ошибке, сумме и приращению.", "example": "Цель равна 4, место начинает с 4. Тактов 4. Ошибка равна цели минус место. Накопленная ошибка увеличивается на эту ошибку. Приращение равно ошибке минус предыдущая ошибка; перед первым тактом предыдущая ошибка равна 0. Сила равна ошибке плюс накопленная ошибка плюс приращение. К месту прибавляется целая половина силы. Частное округляется вниз, к меньшему целому, в том числе для отрицательных. Каково место в конце?", "answer": "4", "error": ""}, {"id": "pie_chart_read", "kind": "visual", "domain": "Визуальные", "subtypes": ["largest", "smallest"], "summary": "Чтение круговой диаграммы (визуальная задача, matplotlib).", "example": "На круговой диаграмме показаны доли категорий. У какой категории самый большой сектор? Укажите её букву.", "answer": "B", "error": ""}, {"id": "pigeon_place", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["hole", "load"], "summary": "размещение голубей по лункам.", "example": "Голубей 4, лунок 3. Голубь i садится в лунку из списка: 1, 3, 3, 1. Каков наименьший номер лунки, в которой оказалось хотя бы два голубя?", "answer": "3", "error": ""}, {"id": "pigeonhole", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Разные логические задачи: расшифровка шифра (Цезарь / подстановка), принцип", "example": "В ящике лежит много шаров 2 различных цветов (поровну достаточно каждого). Их достают не глядя. Сколько предметов нужно достать, чтобы ГАРАНТИРОВАННО среди них оказалось 2 одного цвета?", "answer": "3", "error": ""}, {"id": "pipe_flow", "kind": "text", "domain": "Гидростатика", "subtypes": ["pressure", "speed"], "summary": "давление в трубе переменного сечения.", "example": "Труба из 4 сечений. Пары — площадь и высота: 1 4; 3 0; 3 3; 1 2. Расход равен 3 и один на всю трубу: скорость сечения равна расходу, делённому на площадь, деление точное. Плотность жидкости равна 2, ускорение свободного падения равно 1. Поэтому давление плюс квадрат скорости плюс удвоенная высота одно и то же во всех сечениях. В первом сечении давление равно 5. Какое давление в последнем сечении?", "answer": "9", "error": ""}, {"id": "pivot_cost", "kind": "text", "domain": "Вероятность", "subtypes": ["numer", "denom"], "summary": "среднее число сравнений случайной быстрой сортировки.", "example": "Случайная перестановка длины m сортируется так. Опорный элемент равновероятен и сравнивается с остальными m-1 элементами, затем тем же способом сортируются левая и правая части. e(0) = 0. Для m не меньше 1 среднее число сравнений e(m) равно m-1 плюс (2/m), умноженное на сумму e(0) + ... + e(m-1). Дробь сокращается после каждого m. Здесь длина равна 4. Чему равен числитель e(4)?", "answer": "29", "error": ""}, {"id": "plan_gate", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["fired", "has"], "summary": "план из шагов с одним предусловием.", "example": "В начале включён только бит 1. Дальше 4 шагов, запись «нужен-ставится»: 2>5; 2>3; 4>6; 1>5. Шаг срабатывает, только если нужный бит уже включён, и тогда включает свой бит. Сколько шагов сработает?", "answer": "1", "error": ""}, {"id": "plurality", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["score", "winner"], "summary": "простое голосование.", "example": "Кандидатов 3, номера с 1. Бюллетеней 5, в каждом номер выбранного: 1, 3, 3, 1, 2. У кого больше голосов, тот побеждает. При равенстве побеждает меньший номер. Сколько голосов у кандидата 3?", "answer": "2", "error": ""}, {"id": "pochhammer", "kind": "text", "domain": "Дискретная математика", "subtypes": ["value", "factor"], "summary": "возрастающий факториал.", "example": "Возрастающий факториал из 4 множителей, начиная с 2: 2 * (2+1) * ... * (2+4-1). Каково произведение?", "answer": "120", "error": ""}, {"id": "poisson_row", "kind": "text", "domain": "Электричество", "subtypes": ["mid", "total"], "summary": "итерации дискретного потенциала с зарядами.", "example": "Внутренних узлов 3, их заряды слева направо: 1, 4, 4. Потенциал краёв равен 0, в начале внутренние узлы тоже равны 0. Итераций 4. На итерации каждый узел становится равным целой половине суммы двух соседей и своего заряда. Сосед за краем равен 0. Каков средний узел в конце?", "answer": "4", "error": ""}, {"id": "polar_stack", "kind": "text", "domain": "Волны и оптика", "subtypes": ["light", "dark"], "summary": "стопка поляризаторов с тремя точными долями.", "example": "Свет начинает с яркостью 7. Пластинок 4: 2, 2, 0, 1. Код 0 оставляет яркость. Код 1 оставляет целую половину. Код 2 делает яркость нулём. Если код 2 пришёл на ненулевой свет, это считается гашением. Какова яркость в конце?", "answer": "0", "error": ""}, {"id": "polarization", "kind": "text", "domain": "Волны и оптика", "subtypes": ["malus", "brewster", "two_polarizers"], "summary": "Задачи на поляризацию света.", "example": "Решите задачу на поляризацию света. Поляризованный свет интенсивности I₀ = 245.6 Вт/м² проходит через поляризатор, повёрнутый на угол 48.1°. Найдите интенсивность.", "answer": "Ответ: I = 109.54 Вт/м²", "error": ""}, {"id": "policy_eval", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["value", "total"], "summary": "синхронная оценка фиксированной политики.", "example": "Состояний 2, оценки начинают с нуля. Проходов 3. Запись — номер, награда политики, следующее состояние: 1: 0, 1; 2: 2, 2. На проходе новая оценка равна награде плюс старая оценка следующего состояния. Старые оценки используются для всего прохода. Какова оценка состояния 2?", "answer": "6", "error": ""}, {"id": "policy_expectation", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["value", "advantage"], "summary": "оценка политики как среднее Q по π.", "example": "Вероятность действия = его вес / сумма весов. Оценка политики V = сумма π(a) * Q(a). Преимущество действия = Q(a) - V. Ответ — целое или несократимая дробь. 1: weight 2, Q -4, 2: weight 5, Q -1, 3: weight 5, Q 3. Найдите V.", "answer": "1/6", "error": ""}, {"id": "policy_rollout", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["reward", "end"], "summary": "сумма наград при заданной политике на отрезке.", "example": "Состояния 0..3. Старт в 1. Политика по состояниям, +1 или -1: 0:-1, 1:-1, 2:+1, 3:+1. Награды состояний: -3, -4, 3, 0. За 4 шагов агент переходит по политике; у края шаг наружу оставляет его на месте. Награда шага — награда состояния, в которое он пришёл. Найдите суммарную награду.", "answer": "-12", "error": ""}, {"id": "poly_div", "kind": "text", "domain": "Алгебра", "subtypes": ["quotient", "remainder"], "summary": "деление многочленов столбиком.", "example": "Коэффициенты идут от старшей степени к свободному члену. Делимое: 1, -1, -2, -2, -1. Делитель приведённый: 1, -2, -1. Найдите коэффициент частного при степени 2.", "answer": "1", "error": ""}, {"id": "polya_urn", "kind": "text", "domain": "Вероятность", "subtypes": ["numer", "denom"], "summary": "вероятность конкретной последовательности в урне Полиа.", "example": "В урне 2 красных (R) и 2 синих (B) шаров. Тянут шар, возвращают его и кладут ещё один того же цвета. Последовательность из 3 тиражей: B B B. Найдите числитель сокращённой вероятности этой последовательности.", "answer": "1", "error": ""}, {"id": "polyak_update", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["updated", "delta"], "summary": "мягкое обновление целевых весов.", "example": "Мягкое обновление: θ_new = τ * θ + (1 - τ) * θ_old, τ = 1/4. Координаты нумеруются с 1. Ответ — целое или несократимая дробь. θ = (-3, 3), θ_old = (2, -4). Найдите координату 2 нового вектора.", "answer": "-9/4", "error": ""}, {"id": "polygon_angles", "kind": "text", "domain": "Геометрия", "subtypes": ["sum", "angle", "diagonals"], "summary": "углы и диагонали выпуклого многоугольника.", "example": "Найдите сумму внутренних углов выпуклого 6-угольника в градусах.", "answer": "720", "error": ""}, {"id": "polynomial_factorization", "kind": "text", "domain": "Алгебра", "subtypes": [], "summary": "разложение многочлена на множители.", "example": "Разложите многочлен на множители: x^2 - 2*x - 8", "answer": "(x - 4)*(x + 2)", "error": ""}, {"id": "polynomial_product", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["coefficient", "value"], "summary": "произведение двух многочленов.", "example": "Коэффициенты A от свободного члена: 4. Коэффициенты B: 1. Найдите коэффициент произведения при степени 0.", "answer": "4", "error": ""}, {"id": "popcount_sum", "kind": "text", "domain": "Дискретная математика", "subtypes": ["total", "bits"], "summary": "сумма чисел единиц в двоичной записи.", "example": "Для каждого числа от 1 до 6 посчитайте, сколько единиц в его двоичной записи, и сложите эти количества. Какова сумма?", "answer": "9", "error": ""}, {"id": "portal_walk", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["room"], "summary": "переход по комнатам заданное число раз.", "example": "Комнаты пронумерованы от 0 до 3. Из комнаты i переход ведёт в комнату по списку 0→1, 1→1, 2→2, 3→3. Стартуем в 0 и делаем 4 переходов. В какой комнате окажемся?", "answer": "1", "error": ""}, {"id": "post_inc", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["value", "used"], "summary": "постфиксное и префиксное увеличение.", "example": "Переменная начинает с 1. Операций 4: 0, 1, 1, 0. Код 0 отдаёт старое значение и только потом прибавляет 1. Код 1 сначала прибавляет 1 и отдаёт уже новое значение. Отданные значения складываются отдельно. Какова переменная в конце?", "answer": "5", "error": ""}, {"id": "ppo_clip", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["clipped", "surrogate"], "summary": "обрезка отношения вероятностей в PPO.", "example": "PPO. Отношение вероятностей r = 1 обрезается в отрезок от 1 - ε до 1 + ε, ε = 1/2. Суррогат — меньшее из r * A и (обрезанное r) * A, A = -4. Ответ — целое или несократимая дробь. Найдите обрезанное отношение.", "answer": "1", "error": ""}, {"id": "precision_at_k", "kind": "text", "domain": "Машинное обучение", "subtypes": ["hits", "precision"], "summary": "сколько релевантных объектов в топ-k и сама точность.", "example": "Пары (оценка, метка) слева направо: (1, 1), (4, 1), (4, 0), (1, 0). Метка 1 — релевантный объект. В топ-4 при равной оценке выше стоит левый объект. Сколько релевантных объектов попало в этот топ?", "answer": "2", "error": ""}, {"id": "pred_scan", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["trues", "first"], "summary": "проверка ряда сравнений и место первой ошибки.", "example": "Проверяются 4 сравнений: 3 > 8; 2 = 9; 7 > 9; 1 > 0. Сколько из них верны?", "answer": "1", "error": ""}, {"id": "prime_factorization", "kind": "text", "domain": "Дискретная математика", "subtypes": [], "summary": "разложение числа на простые множители.", "example": "Разложите число 363 на простые множители.", "answer": "3 * 11^2", "error": ""}, {"id": "prime_nu", "kind": "text", "domain": "Дискретная математика", "subtypes": ["total", "at"], "summary": "число различных простых множителей.", "example": "Для каждого числа от 1 до 6 посчитайте, сколько у него различных простых множителей. Повтор одного простого считается один раз. У 1 это 0, у 12 = 2*2*3 это 2. Какова сумма этих количеств?", "answer": "6", "error": ""}, {"id": "prime_omega", "kind": "text", "domain": "Дискретная математика", "subtypes": ["total", "at"], "summary": "число простых множителей с повторениями.", "example": "Для каждого числа от 1 до 6 посчитайте, сколько у него простых множителей с повторениями. У 1 это 0, у 12 = 2*2*3 это 3. Какова сумма этих количеств?", "answer": "7", "error": ""}, {"id": "primorial", "kind": "text", "domain": "Дискретная математика", "subtypes": ["value", "prime"], "summary": "произведение первых простых.", "example": "Возьмите первые 4 простых чисел и перемножьте их по порядку, начиная с 1. Каково произведение?", "answer": "210", "error": ""}, {"id": "priority_bit", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["index", "zeros"], "summary": "первый единичный бит слева.", "example": "Биты читаются слева направо, слева старший приоритет: 0, 0, 1, 1, 0. Номер первой единицы — её позиция, нумерация с 1. Если единиц нет, номер равен 0. Каков номер первой единицы?", "answer": "3", "error": ""}, {"id": "priority_replay", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["probability", "argmax"], "summary": "вероятность пропорционального приоритетного семплирования.", "example": "Приоритеты переходов, номера с 1: 1: 2, 2: 5, 3: 5. Вероятность номера равна его приоритету, делённому на сумму. Номер с наибольшим приоритетом при равенстве — меньший. Найдите вероятность номера 2. Ответ — целое или несократимая дробь.", "answer": "5/12", "error": ""}, {"id": "priority_run", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["tick", "total"], "summary": "по одному такту у заявки с большим приоритетом.", "example": "Заявок 4, все готовы сразу. Запись — приоритет и длина: 2, 1; 3, 1; 1, 1; 4, 1. На каждом такте работает заявка с большим приоритетом, у которой ещё осталась длина. При равенстве берётся меньший номер. Номера с 1. Какая заявка работает на такте 2?", "answer": "2", "error": ""}, {"id": "prob_flow", "kind": "text", "domain": "Квантовая физика", "subtypes": ["bond", "total"], "summary": "ток вероятности комплексной волны.", "example": "Связей между узлами 4. Действительная часть, слева направо: -1 2 2 -1 0. Мнимая часть: 2 1 2 -2 2. В единицах ħ = 1 и m = 1 ток через связь равен действительной части левого узла, умноженной на мнимую часть правого, минус мнимая часть левого, умноженная на действительную часть правого. Каков ток через связь 1, считая связи с 1?", "answer": "-5", "error": ""}, {"id": "program_trace", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Трассировка выполнения мини-программы (присваивания, циклы, условия) над", "example": "Выполните программу (все переменные целые, изначально 0; «==» — сравнение на равенство): a = 1 b = 4 c = 4 repeat 5 times: c = c + 2 if a > 5: c = c - 2 c = c + 1 if c < 5: c = c + 1 c = a - 1 Какое значение будет у переменной b в конце?", "answer": "4", "error": ""}, {"id": "projectile_graph", "kind": "visual", "domain": "Визуальные", "subtypes": ["range", "max_height"], "summary": "Графики движения (визуальные задачи, matplotlib).", "example": "На рисунке — траектория брошенного тела (парабола). Определите дальность полёта — координату x, где тело возвращается на землю (y = 0).", "answer": "6", "error": ""}, {"id": "projectile_motion", "kind": "text", "domain": "Механика", "subtypes": ["range", "max_height", "flight_time", "velocity_at_height"], "summary": "Задачи на движение тела, брошенного под углом к горизонту.", "example": "Решите задачу на движение тела, брошенного под углом к горизонту. Тело брошено под углом 47.7° к горизонту с начальной скоростью 14.8 м/с. Найдите дальность полёта.", "answer": "L = 22.11 м", "error": ""}, {"id": "projectile_tick", "kind": "text", "domain": "Механика", "subtypes": ["range", "height"], "summary": "бросок целыми тактами в плоскости.", "example": "Тело начинает в нуле. Горизонтальная скорость 2 не меняется, вертикальная начинает с 4. Тактов 4. За такт обе координаты прибавляют свои текущие скорости, затем вертикальная скорость уменьшается на 1. Какова горизонтальная координата в конце?", "answer": "8", "error": ""}, {"id": "proof_cases_counterexample", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Tasks in form 'prove or provide counterexample'.", "example": "Докажите утверждение по случаям или приведите кон : "Формальная логика: классификация формул, подсчёт моделей, 3-SAT,", "example": "Истинна ли квантифицированная булева формула? ∀p ∀q ∃r: ((p ↔ (q → r)) ↔ r) (∀ — «для всех», ∃ — «существует»). Ответьте да/нет.", "answer": "нет", "error": ""}, {"id": "qnum_ok", "kind": "text", "domain": "Квантовая физика", "subtypes": ["valid", "first"], "summary": "допустимые четвёрки квантовых чисел.", "example": "Четвёрок квантовых чисел 4: 2 1 0 0; 4 5 3 -1; 1 1 0 0; 2 1 1 0. Порядок в четвёрке: n, l, m, s. Набор допустим, если n не меньше 1, l лежит от 0 до n-1 включительно, m лежит от -l до l включительно, а s равно 1 или -1. Сколько наборов допустимы?", "answer": "0", "error": ""}, {"id": "quadratic", "kind": "text", "domain": "Алгебра", "subtypes": [], "summary": "Решает квадратное уравнение: a*x² + b*x + c = 0.", "example": "Найдите x: x² - 2x - 8 = 0", "answer": "-2, 4", "error": ""}, {"id": "quantum", "kind": "text", "domain": "Квантовая физика", "subtypes": ["photoelectric", "compton", "de_broglie", "hydrogen_atom", "uncertainty", "particle_in_box"], "summary": "задачи по квантовой механике.", "example": "Фотон с частотой 1.266e+15 Гц падает на металл с работой выхода 3.6326876758878557 эВ. Найдите кинетическую энергию фотоэлектрона.", "answer": "1.6032 эВ", "error": ""}, {"id": "queens_check_image", "kind": "visual", "domain": "Визуальные", "subtypes": [], "summary": "Проверка расстановки ферзей по картинке (PIL).", "example": "На доске 5×5 расставлено 5 ферзей (по одному в строке). Корректна ли расстановка, то есть никакие два ферзя не бьют друг друга (по вертикали, горизонтали или диагонали)? Ответьте да/нет.", "answer": "да", "error": ""}, {"id": "quorum_rise", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["passed", "before"], "summary": "голосования с растущим порогом.", "example": "Идут 3 голосований. В начале порог равен 1. Голоса «за» по порядку: 4, 4, 1. Если голосов не меньше порога, решение принято и порог увеличивается на 1. Иначе порог не меняется. Сколько решений принято?", "answer": "2", "error": ""}, {"id": "qwalk_line", "kind": "text", "domain": "Квантовая физика", "subtypes": ["center", "mass"], "summary": "дискретное квантовое блуждание на прямой.", "example": "Квантовое блуждание на прямой, шагов 4. В точке 0 правая амплитуда равна 0, левая равна 1. В остальных точках обе амплитуды равны 0. На шаге монета заменяет правую на правую плюс левую, а левую на правую минус левую. Затем правая амплитуда сдвигается на одну точку вправо, левая на одну точку влево. Вес точки — сумма квадратов её двух амплитуд. Каков вес точки 0 в конце?", "answer": "2", "error": ""}, {"id": "r2_score", "kind": "text", "domain": "Машинное обучение", "subtypes": ["r2", "ss_tot"], "summary": "коэффициент детерминации.", "example": "Истинные значения: -2, 4, 3. Прогнозы: -3, 0, 4. SS_tot — сумма квадратов отклонений истины от её среднего. SS_res — сумма квадратов разностей прогноза и истины. R^2 = 1 - SS_res / SS_tot. Ответ — целое или несократимая дробь. Найдите R^2.", "answer": "4/31", "error": ""}, {"id": "radiation_pressure", "kind": "text", "domain": "Квантовая физика", "subtypes": ["photon_momentum", "pressure_absorbing", "pressure_reflecting"], "summary": "давление света и импульс фотона.", "example": "Найдите импульс фотона с длиной волны λ = 3.120e-07 м.", "answer": "p = 2.124e-27 кг·м/с", "error": ""}, {"id": "radioactive_decay", "kind": "text", "domain": "Квантовая физика", "subtypes": ["remaining", "activity", "age", "decay_constant"], "summary": "Задачи на радиоактивный распад.", "example": "Решите задачу на радиоактивный распад. Период полураспада изотопа T₁/₂ = 18.2 лет. Какая доля останется через t = 19.78 лет?", "answer": "Ответ: 47.08%", "error": ""}, {"id": "rally_lead", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["leader", "swings"], "summary": "смена лидера по ходу розыгрыша.", "example": "Розыгрыш из 4 очков. Каждое очко достаётся команде 1 или команде 2: 1 1 2 2. Лидер — команда с большим  1 -1. После всех шагов накопитель равен сумме A^k Q (A^k)^T от нулевой степени до степени 4. Чему равен верхний левый элемент?", "answer": "340", "error": ""}, {"id": "reagent_chain", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["product", "left_a"], "summary": "цепочка реакций с недостающим реагентом.", "example": "В колбе 12 молекул A и 14 молекул B. Дальше 3 реакций. Для каждой записано, сколько молекул A и B нужно на одну молекулу продукта: 1+3, 3+1, 2+3. На шаге реакция повторяется столько раз, сколько позволяет меньший из двух запасов, и оба запаса уменьшаются. Сколько молекул продукта получится всего?", "answer": "6", "error": ""}, {"id": "recaman", "kind": "text", "domain": "Дискретная математика", "subtypes": ["last", "subs"], "summary": "последовательность Рекамана.", "example": "Последовательность начинает с 0. На шаге t из текущего числа вычитается t, если результат положителен и ещё не встречался. Иначе t прибавляется. Каково число после 5 шагов?", "answer": "7", "error": ""}, {"id": "reciprocal_rank", "kind": "text", "domain": "Машинное обучение", "subtypes": ["reciprocal", "rank"], "summary": "обратный ранг первого релевантного объекта.", "example": "Метки от лучшей оценки к худшей: 0 0 1 1. Единица — релевантный объект. Ранг — позиция первой единицы, нумерация с 1. Обратный ранг равен 1, делённой на ранг. Найдите обратный ранг. Ответ — целое или несократимая дробь.", "answer": "1/3", "error": ""}, {"id": "record_highs", "kind": "text", "domain": "Дискретная математика", "subtypes": ["peak", "records"], "summary": "строгие рекорды слева направо.", "example": "Числа слева направо, всего 4: 1, 4, 4, 1. Рекорд — число, которое строго больше всех предыдущих. Первое число всегда рекорд. Каково наибольшее значение?", "answer": "4", "error": ""}, {"id": "recurrence", "kind": "text", "domain": "Дискретная математика", "subtypes": [], "summary": "замкнутая форма линейной рекурренты второго порядка.", "example": "Решите рекуррентное соотношение a(n) = -1·a(n-1) + 2·a(n-2) с начальными условиями a(0) = 4, a(1) = 1.", "answer": "(-2)^n + 3", "error": ""}, {"id": "recurrence_walk", "kind": "text", "domain": "Дискретная математика", "subtypes": ["last"], "summary": "несколько шагов рекуррентности x_k = x_{k-1} + x_{k-2}.", "example": "Последовательность начинается с 3, 8. Каждый следующий член равен сумме двух предыдущих. Найдите член номер 5.", "answer": "30", "error": ""}, {"id": "reduce_rho", "kind": "text", "domain": "Квантовая физика", "subtypes": ["pop", "purity"], "summary": "частичный след чистого состояния двух частиц.", "example": "Две частицы. У первой два состояния, у второй их 4. Амплитуды первого состояния первой частицы по базису второй: -1 2 2 -1. Амплитуды второго состояния: 0 2 1 2. Частичный след по второй частице: население первого состояния — сумма квадратов первой строки. Население второго — сумма квадратов второй строки. Недиагональный элемент — сумма произведений столбцов. Чистота — сумма квадратов населений плюс удвоенный квадрат недиагонального элемента. Каково население первого состояния?", "answer": "10", "error": ""}, {"id": "reduced_mass", "kind": "text", "domain": "Механика", "subtypes": ["reduced", "reciprocal"], "summary": "приведённая масса двух тел.", "example": "Две массы: m1 = 4, m2 = 3. Приведённая масса μ = m1 * m2 / (m1 + m2). Найдите μ. Ответ — целое или несократимая дробь.", "answer": "12/7", "error": ""}, {"id": "ref_count", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["count", "frees"], "summary": "счётчик ссылок на объект.", "example": "У объекта сначала одна ссылка. Дальше 4 событий, плюс один или минус один: 1, 1, -1, -1. Плюс один добавляет ссылку. Минус один снимает ссылку, но не опускает счёт ниже нуля. Когда счёт становится нулём, объект освобождён. Следующий плюс один снова ставит одну ссылку. Каков счёт в конце?", "answer": "1", "error": ""}, {"id": "ref_resolve", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["last", "copies"], "summary": "раскрытие ссылок на уже заполненные ячейки.", "example": "Ячеек 4, они заполняются слева направо: 0 3; 0 5; 1 4; 0 7. В каждой код и число. Код 0 записывает само число. Код 1 копирует уже заполненную ячейку с этим номером, счёт с нуля. Номер вне уже заполненных ячеек даёт 0 и копией не считается. Каково значение последней ячейки?", "answer": "7", "error": ""}, {"id": "reg_swap", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["left", "swaps"], "summary": "две переменные и постоянное слагаемое.", "example": "Две переменные начинают с 1 и 4. Постоянное слагаемое равно 2. Команд 4: 0, 1, 2, 1. Код 0 меняет переменные местами. Код 1 прибавляет вторую к первой. Код 2 прибавляет постоянное слагаемое ко второй. Какова первая переменная в конце?", "answer": "8", "error": ""}, {"id": "regex_dfa", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "принадлежность строки формальному языку над алфавитом {a, b}.", "example": "Язык над алфавитом {a, b} задан описанием: повторение блока 'ab' ноль или более раз. Принадлежит ли этому языку строка \"bb\"? Ответьте YES или NO.", "answer": "NO", "error": ""}, {"id": "reject_add", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["rejects", "value"], "summary": "прибавление отклоняется целиком, если выходит за пределы.", "example": "Значение начинает с 1. Нижняя граница равна 0, верхняя равна 4. Прибавлений 4: 4, -2, 1, 3. Прибавление принимается, только если сумма остаётся от 0 до 4 включительно. Иначе всё прибавление отклоняется и значение не меняется. Сколько прибавлений отклонено?", "answer": "3", "error": ""}, {"id": "relative_velocity", "kind": "text", "domain": "Механика", "subtypes": ["relative", "first_speed"], "summary": "скорость одного тела относительно другого на прямой.", "example": "Прямая, вправо положительно. Скорость A относительно B равна vA - vB. vA = -3 м/с, vB = 8 м/с. Найдите скорость A относительно B.", "answer": "-11", "error": ""}, {"id": "relativistic_energy", "kind": "text", "domain": "Относительность", "subtypes": ["kinetic", "total", "energy_momentum"], "summary": "релятивистская энергия частиц.", "example": "Частица массой m = 9.109e-31 кг движется со скоростью 0.34·c. Найдите её релятивистскую кинетическую энергию.", "answer": "KE = 5.186e-15 Дж", "error": ""}, {"id": "relativity", "kind": "text", "domain": "Относительность", "subtypes": ["time_dilation", "length_contraction", "mass_energy", "relativistic_momentum", "lorentz_factor"], "summary": "задачи по специальной теории относительности.", "example": "В системе отсчёта, движущейся со скоростью β = 0.219c, прошло собственное время t₀ = 54.87869330429923 с. Найдите время в неподвижной системе.", "answer": "t = 56.2440 с", "error": ""}, {"id": "relay_time", "kind": "text", "domain": "Механика", "subtypes": ["total"], "summary": "эстафета из нескольких участков.", "example": "Эстафета из 3 участков. 1) 20 м при 4 м/с. 2) 9 м при 3 м/с. 3) 48 м при 8 м/с. Найдите общее время в секундах.", "answer": "14", "error": ""}, {"id": "relu_chain", "kind": "text", "domain": "Машинное обучение", "subtypes": ["final", "factor"], "summary": "цепь линейных слоёв с отсечением отрицательных.", "example": "Начальное значение 1. Дальше 4 слоёв, у каждого вес и сдвиг: 1 2, -1 0, 1 1, 1 2. Вход слоя равен вес умножить на текущее значение плюс сдвиг. Если вход неположителен, выход слоя равен 0, а множитель начального значения становится 0 и таким остаётся. Если вход положителен, выход равен этому входу, а множитель умножается на вес. Каков выход последнего слоя?", "answer": "3", "error": ""}, {"id": "rencontres_row", "kind": "text", "domain": "Дискретная математика", "subtypes": ["fixed", "total"], "summary": "перестановки с данным числом неподвижных точек.", "example": "Субфакториал: !(0) = 1, !(1) = 0, дальше !(n) = (n-1)*(!(n-1)+!(n-2)). Число перестановок n элементов с k неподвижными точками равно C(n, k)*!(n-k). Коэффициент C(a, b) — произведение (a-b+i)/i по i от 1 до b. огика и алгоритмы", "subtypes": [], "summary": "Пошаговые алгоритмические задачи: вычисление ОПЗ (RPN), проверка баланса", "example": "Вычислите выражение в обратной польской записи (постфикс): 4 6 3 * - 9 +", "answer": "-5", "error": ""}, {"id": "ruin_time", "kind": "text", "domain": "Вероятность", "subtypes": ["span", "total"], "summary": "среднее время до разорения или цели при равных ставках.", "example": "Капитал идёт от 0 до 5. В 0 и в 5 игра останавливается. Из промежуточной точки i с равной вероятностью делается шаг в i-1 или в i+1. Среднее число шагов до остановки равно 0 на краях, а в промежутке удвоенное время равно 2 плюс время слева плюс время справа. Сумма разностей от 1 до 5 равна нулю, поэтому первая разность равна 5-1. Каждая следующая разность меньше на 2. Время в точке — сумма её разностей. Промежуточных точек 4. Чему равно среднее число шагов из точки 2?", "answer": "6", "error": ""}, {"id": "ruler_sum", "kind": "text", "domain": "Дискретная математика", "subtypes": ["total", "power"], "summary": "показатель двойки в разложении чисел от 1 до n.", "example": "Для каждого числа от 1 до 6 возьмите, сколько раз оно делится на 2. У нечётного числа это 0. Какова сумма этих показателей?", "answer": "4", "error": ""}, {"id": "run_length", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["runs", "span"], "summary": "серии одинаковых символов.", "example": "Строка из 6 символов 0 и 1: 0, 0, 1, 1, 0, 0. Серия — максимальный кусок одинаковых символов подряд. Сколько серий?", "answer": "3", "error": ""}, {"id": "safe_bits", "kind": "text", "domain": "Вероятность", "subtypes": ["count", "tail"], "summary": "число двоичных строк без двух единиц подряд.", "example": "Сколько двоичных строк длины 4 не содержат двух единиц подряд? Строка длины 1: 0 и 1. Более длинная получается так: к любой подходящей можно дописать 0, а 1 можно дописать только к строке, которая кончается нулём.", "answer": "8", "error": ""}, {"id": "sandpile_path", "kind": "text", "domain": "Дискретная математика", "subtypes": ["topples", "remaining"], "summary": "обвалы фишек на дорожке.", "example": "В ряду 4 клеток, порог равен 2. В клетку 2 кладут 8 фишек. Если в клетке хотя бы 2 фишки, она отдаёт по одной соседу слева и соседу справа. У крайней клетки недостающий сосед означает потерю фишки. Обваливается самая левая готовая клетка. Сколько обвалов будет до устойчивости?", "answer": "16", "error": ""}, {"id": "sarsa", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["q_new", "td_error"], "summary": "одно обновление SARSA.", "example": "SARSA: δ = r + γ * Q_next - Q, Q_new = Q + α * δ. Q_next — оценка именно выбранного следующего действия, не максимум. Ответ — целое или несократимая дробь. Q = -2, α = 1, r = 4, γ = 1, Q_next = 3. Найдите Q_new.", "answer": "7", "error": ""}, {"id": "sarsa_trajectory", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["q_value", "best_action"], "summary": "несколько обновлений SARSA подряд.", "example": "SARSA, таблица в начале нулевая. Состояний 2, действий 2, номера с 1. α = 1, γ = 1. Обновление: Q = Q + α * (r + γ * Q(следующее состояние, выбранное действие) - Q). Записи по порядку: состояние, действие, награда, следующее состояние, следующее действие. 1, 1, 2, 2, 1; 1, 2, 2, 1, 1; 2, 2, 3, 1, 1; 1, 2, 0, 1, 1. Лучшее действие при равенстве — меньший номер. Ответ — целое или несократимая дробь. Найдите итоговую Q состояния 1 и действия 2.", "answer": "2", "error": ""}, {"id": "sat_smt_mini", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Mini SAT/SMT proofs: satisfiable/unsatisfiable with witness or contradiction.", "example": "Определите, выполнима ли формула (SAT/UNSAT): (not x3 OR x1) AND (x3 OR x1 OR not x2) AND (x3 OR x1 OR not x2). Если SAT — приведите пример присваивания.", "answer": "SAT:x1=False,x2=False,x3=False", "error": ""}, {"id": "saturate_count", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["value", "hits"], "summary": "счётчик с потолком и сбросом.", "example": "Счётчик начинает с нуля, потолок 3. Команд 5: 1, 1, 1, 1, 0. Единица прибавляет один, пока значение ниже потолка. На потолке единица значение не меняет, но считается ударом. Ноль сбрасывает значение в ноль и ударом не считается. Каково конечное значение?", "answer": "0", "error": ""}, {"id": "scatter_plot", "kind": "visual", "domain": "Визуальные", "subtypes": ["trend"], "summary": "чтение диаграммы рассеяния: определить характер связи между", "example": "На диаграмме рассеяния показаны пары (X, Y). Какова связь между X и Y? Ответьте одним словом: «положительная», «отрицательная» или «отсутствует».", "answer": "положительная", "error": ""}, {"id": "sch_defect", "kind": "text", "domain": "Квантовая физика", "subtypes": ["site", "defect"], "summary": "невязка стационарного уравнения Шрёдингера.", "example": "Волновая функция на 4 узлах: -1 2 2 -1. Потенциал: 0 2 1 3. Пробная энергия 3. За краями значение равно 0. Шаг сетки и ħ²/2m равны 1. Действие оператора энергии на узел: минус левый сосед, плюс удвоенное значение, минус правый сосед, плюс потенциал, умноженный на значение. Невязка узла равна этому действию минус пробная энергия, умноженная на значение узла. Какова невязка узла 1?", "answer": "-1", "error": ""}, {"id": "schema_check", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["valid", "first"], "summary": "запись верна, если первое поле положительно и два других различны.", "example": "Записей 5, в каждой три числа: 1 1 2; 3 0 0; 3 2 1; 1 3 3; 3 1 1. Запись верна, если первое число больше нуля и второе не равно третьему. Сколько записей верны?", "answer": "2", "error": ""}, {"id": "schroder_row", "kind": "text", "domain": "Дискретная математика", "subtypes": ["value", "numer"], "summary": "большие числа Шрёдера.", "example": "Большие числа Шрёдера: S(0) = 1, S(1) = 2. Для n от 2 числитель (6*n-3)*S(n-1) - (n-2)*S(n-2) делится на n+1 нацело. Каково S(4)?", "answer": "90", "error": ""}, {"id": "scope_lookup", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["value", "depth"], "summary": "поиск имени во вложенных областях.", "example": "Имена 1, 2 и 3. Сначала есть одна внешняя область, все имена равны 0. Команд 5: войти; записать 2 = 8; записать 1 = 1; записать 2 = 5; записать 1 = 8. Войти открывает внутреннюю область. Выйти закрывает её, внешнюю закрыть нельзя. Запись кладёт значение в текущую область. Поиск идёт изнутри наружу. Чему равно имя 3 в конце?", "answer": "0", "error": ""}, {"id": "screen_count", "kind": "text", "domain": "Вероятность", "subtypes": ["true_pos", "false_pos"], "summary": "положительные тесты больных и здоровых.", "example": "Клиник 4: 8 6; 8 0; 8 0; 6 4. Пара — число больных и число здоровых. Из каждых 2 больных положительный тест у 1. Из каждых 2 здоровых положительный тест у 0. Оба числа людей делятся на 2 нацело. Сколько всего больных с положительным тестом?", "answer": "15", "error": ""}, {"id": "seating_circular", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Дедуктивные задачи: логическая сетка соответствий, круговая рассадка,", "example": "5 человек сидят за круглым столом: Анна, Борис, Вера, Глеб, Дина. Подсказки: - Вера sits next to Глеб. - Анна sits next to Вера. - Борис sits next to Анна. Кто сидит рядом с Дина? Назовите обоих соседей.", "answer": "Борис, Глеб", "error": ""}, {"id": "second_price", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["winner", "payment"], "summary": "аукцион второй цены.", "example": "Аукцион второй цены. Побеждает наибольшая ставка; при равенстве — меньший номер. Победитель платит наибольшую из остальных ставок. Ставки (номер, ставка): (1, 8), (2, 19), (3, 18), (4, 5). Кто победил? Ответьте номером.", "answer": "2", "error": ""}, {"id": "secret_share", "kind": "text", "domain": "Дискретная математика", "subtypes": ["secret"], "summary": "восстановление секрета Шамира по модулю простого.", "example": "Секрет разделён по схеме Шамира по модулю 11. Многочлен имеет степень меньше 2, секрет — его значение в нуле. Точки: (3, 0), (6, 2). Найдите секрет от 0 до 10.", "answer": "9", "error": ""}, {"id": "selection_swaps", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["swaps", "pick"], "summary": "число обменов в сортировке выбором.", "example": "Массив из 5 чисел: 2, 5, 5, 2, 3. Сортировка выбором на каждом проходе, кроме последнего места, берёт минимум оставшегося хвоста. Обмен считается, только если этот минимум стоит не в начале хвоста. При равенстве берётся более левый. Сколько обменов будет?", "answer": "2", "error": ""}, {"id": "sensible_heat", "kind": "text", "domain": "Термодинамика", "subtypes": ["heat", "mass", "specific_heat"], "summary": "количество теплоты Q = c * m * ΔT.", "example": "Нагрев без фазового перехода: Q = c * m * dT. c = 2, m = 5, dT = 5. Найдите Q.", "answer": "50", "error": ""}, {"id": "sequence", "kind": "text", "domain": "Дискретная математика", "subtypes": ["arithmetic_nth", "arithmetic_sum", "geometric_nth", "geometric_sum", "fibonacci_nth", "recurrence", "pattern", "series_sum"], "summary": "задачи на последовательности.", "example": "Найдите 9-й член арифметической прогрессии с первым членом -5 и разностью 8.", "answer": "59", "error": ""}, {"id": "sequence_alignment", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["score"], "summary": "вес глобального выравнивания Нидлмана–Вунша.", "example": "Глобальное выравнивание строк ccgt и aatg. Совпадение даёт +1, несовпадение даёт -1, дырка даёт -1. Найдите наибольший вес.", "answer": "-3", "error": ""}, {"id": "series", "kind": "text", "domain": "Анализ", "subtypes": ["geometric_sum", "convergence_test", "partial_sum", "telescoping"], "summary": "задачи на ряды и сходимость.", "example": "Найдите сумму бесконечного геометрического ряда: 4 + 2.28 + ...", "answer": "S = 9.3023", "error": ""}, {"id": "series_cap", "kind": "text", "domain": "Электричество", "subtypes": ["voltage", "energy"], "summary": "последовательные конденсаторы с общим зарядом.", "example": "Конденсаторы соединены последовательно, заряд 12 на каждом один и тот же. Ёмкостей 3: 2, 6, 6. Напряжение одного — заряд, делённый на ёмкость. Напряжения складываются. Каково полное напряжение?", "answer": "10", "error": ""}, {"id": "series_conv", "kind": "text", "domain": "Дискретная математика", "subtypes": ["at", "total"], "summary": "полная дискретная свёртка двух рядов.", "example": "Первый ряд длины 4: -1, 2, 2, -1. Второй ряд: 0, 2, 1. Полная свёртка: выход с номером k, нумерация с 0, складывает произведения членов, индексы которых в сумме дают k. Каков выход номер 6? Здесь номер считается с 1.", "answer": "-1", "error": ""}, {"id": "series_parallel_network", "kind": "text", "domain": "Сети", "subtypes": ["resistor", "capacitor", "spring", "thermal"], "summary": "свёртка последовательно-параллельной сети.", "example": "Дана цепь резисторов (последовательно = сумма, параллельно = обратная сумма обратных): parallel(series(46 Ω, 31 Ω), 35 Ω). Найдите эквивалентное сопротивление (в Ом).", "answer": "24.0625 Ом", "error": ""}, {"id": "set_logic", "kind": "text", "domain": "Дискретная математика", "subtypes": ["union", "intersection", "difference", "symmetric_difference", "complement", "cardinality", "power_set", "cartesian_product", "boolean_simplify", "truth_table", "venn_problem"], "summary": "задачи на множества и логику.", "example": "Найдите A ∪ B, где A = {5, 18, 19} и B = {1, 3, 16, 20}.", "answer": "{1, 3, 5, 16, 18, 19, 20}", "error": ""}, {"id": "set_reasoning", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["union", "only_a", "neither"], "summary": "задачи на множества и принцип включения-исключения.", "example": "В группе 26 человек. 9 знают английский, 13 знают немецкий, 3 знают оба языка. Сколько человек знают хотя бы один из языков?", "answer": "19", "error": ""}, {"id": "sgd_online", "kind": "text", "domain": "Машинное обучение", "subtypes": ["weight", "loss"], "summary": "пошаговый градиентный спуск по одному примеру.", "example": "Модель y = w*x, примеров 4. Старт w = -1. Запись — x и y: -1, 0; 2, 2; -2, 2; -2, 1. Остаток считается до шага: w*x - y. Затем w := w - x*остаток. Каков конечный вес?", "answer": "46", "error": ""}, {"id": "shadow_height", "kind": "text", "domain": "Геометрия", "subtypes": ["pole", "stick_shadow"], "summary": "высота по подобным теням.", "example": "Палка высотой 2 м отбрасывает тень 5 м. В тот же момент тень столба равна 25 м. Найдите высоту столба в метрах.", "answer": "10", "error": ""}, {"id": "shannon_entropy", "kind": "text", "domain": "Машинное обучение", "subtypes": ["value", "compare"], "summary": "энтропия Шеннона в битах.", "example": "Дискретное распределение задано кратностями исходов: 4, 4. Найдите энтропию Шеннона в битах. Ответ — целое или несократимая дробь.", "answer": "1", "error": ""}, {"id": "shape_match", "kind": "visual", "domain": "Визуальные", "subtypes": ["matches", "here"], "summary": "совпадение фигуры после поворота.", "example": "Слева в зелёной рамке образец. Справа от него фигуры по порядку. Фигура совпадает с образцом, если её можно повернуть на 0, 90, 180 или 270 градусов и наложить на образец. Отражение не считается поворотом. Сколько фигур справа совпадают с образцом?", "answer": "2", "error": ""}, {"id": "shape_reward", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["total", "bonus"], "summary": "формирование награды потенциалом.", "example": "Состояний 3, потенциалы с номера 1: -1, 4, -2. Переходов 4, запись — состояние, награда, следующее: 2, 3, 3; 3, -3, 3; 1, 3, 2; 3, -1, 1. Добавка равна потенциалу следующего минус потенциал текущего. Сформированная награда равна награде плюс добавка. Какова сумма сформированных наград?", "answer": "2", "error": ""}, {"id": "shapley_value", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["value"], "summary": "вектор Шепли для трёх игроков.", "example": "Кооперативная игра трёх игроков, v(пустая) = 0. v(1) = 1, v(2) = 4, v(3) = 4, v(12) = 6, v(13) = 7, v(23) = 12, v(123) = 13. Запись v(12) — коалиция игроков 1 и 2. Найдите значение Шепли игрока 3. Ответ — целое или несократимая дробь.", "answer": "6", "error": ""}, {"id": "shell_fill", "kind": "text", "domain": "Квантовая физика", "subtypes": ["placed", "unpaired"], "summary": "заполнение подоболочек по Паули и Хунду.", "example": "Подоболочек 4, их ёмкости: 2 10 10 2. Электронов 11. Ёмкость чётная, орбиталей в подоболочке вдвое меньше. Заполнение идёт по порядку ёмкостей. В подоболочку помещается не больше её ёмкости, лишние электроны переходят дальше. Сначала электроны садятся по одному на орбиталь, затем спариваются. Сколько электронов удалось разместить?", "answer": "11", "error": ""}, {"id": "shift_add", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["product", "adds"], "summary": "умножение сдвигами и сложениями.", "example": "Множимое равно 2. Множитель задан 3 битами от младшего к старшему: 0 1 1. Начинаем с нуля и со сдвига, равного множимому. Если бит равен 1, сдвиг прибавляется к сумме. После каждого бита сдвиг удваивается. Чему равно произведение?", "answer": "12", "error": ""}, {"id": "shock_jump", "kind": "text", "domain": "Термодинамика", "subtypes": ["pressure", "density"], "summary": "прямой скачок уплотнения идеального газа.", "example": "Прямых скачков 4: 5 2 4; 4 3 12; 10 2 8; 15 3 9. Тройка — плотность, скорость и давление перед скачком. Показатель адиабаты 5/3. Поток массы равен плотности, умноженной на скорость. Плотность за скачком — наименьшее целое больше передней плотности и не больше её учетверенного значения, на которое поток массы делится нацело. Скорость за скачком — этот частный результат. Давление за скачком равно переднему давлению плюс передняя плотность, умноженная на квадрат передней скорости, минус задняя плотность, умноженная на квадрат задней скорости. При этом 5 умножить на переднее давление и заднюю плотность плюс квадрат передней скорости, умноженный на обе плотности, равно такому же выражению с задним давлением и квадратом задней скорости. Каково давление за последним скачком?", "answer": "99", "error": ""}, {"id": "shoelace_area", "kind": "text", "domain": "Геометрия", "subtypes": [], "summary": "площадь простого многоугольника по координатам вершин.", "example": "Найдите площадь многоугольника с вершинами (в порядке обхода): (1, -5), (2, 0), (-2, 7), (-4, 2).", "answer": "33", "error": ""}, {"id": "shoelace_image", "kind": "visual", "domain": "Визуальные", "subtypes": [], "summary": "Визуальный вариант площади многоугольника (matplotlib).", "example": "На координатной плоскости изображён многоугольник с 4 вершинами (их координаты подписаны). Найдите его площадь.", "answer": "33", "error": ""}, {"id": "shoot_psi", "kind": "text", "domain": "Квантовая физика", "subtypes": ["edge", "inner"], "summary": "интегрирование стационарного уравнения Шрёдингера.", "example": "Стационарное уравнение Шрёдингера на 4 внутренних узлах. Потенциал: -1 2 2 -1. Пробная энергия 2. Слева от первого узла значение 0, в первом узле значение 1. Шаг сетки и величина ħ²/2m равны 1. Следующий узел равен удвоенному текущему минус предыдущий плюс разность потенциала и пробной энергии, умноженная на текущий узел. Каково значение сразу за последним внутренним узлом?", "answer": "8", "error": ""}, {"id": "short_circuit", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["value", "reads"], "summary": "короткое замыкание конъюнкции и дизъюнкции.", "example": "Операндов 4. Первый бит равен 0. Дальше пары: код операции и бит. Код 0 — и, код 1 — или. Пары: 0 1, 1 0, 0 1. И не читает бит, если текущее значение уже 0. Или не читает бит, если текущее значение уже 1. Иначе новое значение — это и или или с прочитанным битом. Каково значение в конце?", "answer": "0", "error": ""}, {"id": "shortest_path_count", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["path_count", "level_size"], "summary": "кратчайшие пути в невзвешенном графе.", "example": "Невзвешенный неориентированный граф, вершины 1..5, рёбра: 1-2, 1-3, 1-5, 2-4, 3-4, 4-5. Сколько различных кратчайших путей между 1 и 3?", "answer": "1", "error": ""}, {"id": "shortest_path_image", "kind": "visual", "domain": "Визуальные", "subtypes": [], "summary": "Визуальные варианты графовых задач: граф рисуется через networkx, а логика и", "example": "На рисунке — взвешенный неориентированный граф (числа на рёбрах — веса). Найдите вес кратчайшего пути между вершиной 3 (зелёная) и вершиной 4 (красная).", "answer": "1", "error": ""}, {"id": "siding_counter", "kind": "text", "domain": "Механика", "subtypes": ["bit", "exit"], "summary": "вагоны и цепочка пружинных стрелок.", "example": "В ряд стоят 2 стрелок, сначала все в положении 0. Вагон, пришедший на стрелку в положении 0, уходит в её тупик, а стрелка становится 1. Вагон, пришедший на стрелку в положении 1, переводит её в 0 и едет к следующей стрелке. Проезжает 3 вагонов. Какое положение у стрелки номер 1? Стрелки нумеруются с 1 от входа.", "answer": "1", "error": ""}, {"id": "sigma_row", "kind": "text", "domain": "Дискретная математика", "subtypes": ["total", "at"], "summary": "сумма делителей и её накопление.", "example": "Для каждого числа от 1 до 6 сложите все его положительные делители, включая 1 и само число. Какова сумма этих сумм?", "answer": "33", "error": ""}, {"id": "sign_walk", "kind": "text", "domain": "Дискретная математика", "subtypes": ["place", "highs"], "summary": "блуждание шагами +1 и -1.", "example": "Точка начинает в нуле. Дальше 4 шагов: -1, -1, +1, +1. Положительный шаг прибавляет 1, отрицательный вычитает 1. Какова конечная координата?", "answer": "0", "error": ""}, {"id": "signal_edges", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["rises", "longest"], "summary": "фронты и самая длинная единица в сигнале.", "example": "Сигнал из 5 битов: 0 0 1 1 0. Фронт — это переход от 0 к 1. Перед первым битом сигнал считается нулём. Сколько фронтов в сигнале?", "answe
