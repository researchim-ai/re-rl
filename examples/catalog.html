": "Машинное обучение", "subtypes": ["bad", "worst"], "summary": "запас между своим и чужим примером.", "example": "Троек 4. В каждой три числа на прямой: опорное, свой пример и чужой пример. Тройки: 3 9 8; 2 5 9; 7 9 1; 9 0 7. Запас равен модулю разности опорного и чужого минус модуль разности опорного и своего. Тройка нарушает условие, если запас меньше 1. Сколько троек нарушают условие?", "answer": "2", "error": ""}, {"id": "truck_trips", "kind": "text", "domain": "Прикладная математика", "subtypes": ["trips", "leftover"], "summary": "погрузка в заданном порядке без перестановки грузов.", "example": "Кузов вмещает 5. Грузы подают строго по порядку, переставлять их нельзя: 2, 5, 5, 2. Это 4 грузов. Если очередной не влезает, начинается новый рейс, а старый уезжает. Сколько рейсов потребуется?", "answer": "4", "error": ""}, {"id": "truth_table", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Формальная логика: классификация формул, подсчёт моделей, 3-SAT,", "example": "Классифицируйте формулу над переменными p, q: (((q ↔ p) ∧ (q → p)) ∧ q) Ответьте одним словом: «тавтология» (всегда истинна), «противоречие» (всегда ложна) или «нейтральная» (истинна не всегда и не никогда).", "answer": "нейтральная", "error": ""}, {"id": "tsp", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Графовые алгоритмы как задачи с пошаговым решением.", "example": "5 городов (0..4), симметричные расстояния: 0-1: 4; 0-2: 10; 0-3: 9; 0-4: 3; 1-2: 6; 1-3: 10; 1-4: 8; 2-3: 11; 2-4: 10; 3-4: 2. Найдите длину кратчайшего замкнутого маршрута, проходящего через все города по разу и возвращающегося в старт.", "answer": "26", "error": ""}, {"id": "turing_machine", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Симуляция автоматов и клеточных систем.", "example": "Машина Тьюринга (состояния 0..1, старт 0, головка на клетке 0, вне ленты — нули). Лента: 1000. Правила: (0,0)→(пиши 0, R, состояние 1); (0,1)→(пиши 1, R, состояние 0); (1,0)→(пиши 1, L, состояние 0); (1,1)→(пиши 0, L, состояние 1). Сколько единиц будет на ленте после 8 шагов?", "answer": "2", "error": ""}, {"id": "turn_signs", "kind": "text", "domain": "Геометрия", "subtypes": ["lefts", "rights"], "summary": "левые и правые повороты ломаной.", "example": "Ломаная из точек, запись x y: -1 4; -2 1; 3 -3; -4 3; 0 4. В каждой внутренней вершине знак поворота — произведение соседних сторон крест-накрест: (x2-x1) умножить на (y3-y2) минус (y2-y1) умножить на (x3-x2). Положительный знак — влево, отрицательный — вправо, ноль — прямо. Сколько поворотов влево? Внутренних вершин 3.", "answer": "2", "error": ""}, {"id": "turnstile", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["entries", "state"], "summary": "турникет с монетой и толчком.", "example": "Турникет начинает закрытым. Действий 4: 0, 0, 1, 1. Код 0 — монета, код 1 — толчок. Монета открывает закрытый турникет. Толчок открытого турникета пропускает человека и снова закрывает его. Монета в открытый и толчок в закрытый ничего не делают. Сколько человек прошло?", "answer": "1", "error": ""}, {"id": "turtle_walk", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["x", "manhattan"], "summary": "путь по командам с поворотами на 90°.", "example": "Черепаха стартует в (0, 0) и смотрит вправо. F d — вперёд на d, L — поворот налево на 90°, R — направо на 90°. Команд 3: 1) F 2. 2) F 4. 3) F 1. Найдите итоговую координату x.", "answer": "7", "error": ""}, {"id": "twin_box", "kind": "text", "domain": "Измерения", "subtypes": ["last", "total"], "summary": "две одинаковые суммы окна, одна за другой.", "example": "Отсчётов 4: 1, 4, 4, 1. Сначала каждая клетка заменяется суммой себя и двух соседей, за краем 0. Затем то же правило применяется уже к новому ряду. Какова последняя клетка второго ряда?", "answer": "14", "error": ""}, {"id": "two_color", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["conflicts", "first"], "summary": "последовательная раскраска графа в два цвета.", "example": "Вершин 5, номера с 1. Рёбра: 1 4; 1 5; 2 5; 3 5; 4 5. Вершины красятся по порядку. Если у покрашенных соседей один цвет, вершина получает другой: цвета 1 и 2. Если соседей нет, цвет 1. Если у соседей оба цвета, это конфликт и вершина остаётся без цвета 0. Сколько конфликтов?", "answer": "1", "error": ""}, {"id": "two_pointer_merge", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["kth", "wins"], "summary": "слияние двух неубывающих списков.", "example": "Два неубывающих списка сливают в один. При равенстве берут из левого. Левый: 5, 9. Правый: 3, 7. Какой элемент стоит на месте 4 в слитом списке? Места нумеруются с 1.", "answer": "9", "error": ""}, {"id": "two_stack", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["got", "pours"], "summary": "очередь из двух стеков.", "example": "Очередь сделана из двух стеков, оба пусты. Команд 4, в каждой код и число: 0 5, 0 3, 1 0, 0 5. Код 0 кладёт число в левый стек. Код 1 снимает верх правого стека. Если правый стек пуст, весь левый переливается в правый одним переносом: верх левого становится низом правого, и это один перенос. Снятие из пустой очереди даёт 0. Какова сумма снятых чисел?", "answer": "5", "error": ""}, {"id": "two_tank", "kind": "text", "domain": "Гидростатика", "subtypes": ["left", "right"], "summary": "два сосуда с постоянным притоком и перетоком.", "example": "Левый уровень начинает с 3, правый с 9. Тактов 4. На каждом такте в левый сосуд доливается 2. Затем переток равен целой половине разности левого и правого уровней. Левый уровень уменьшается на переток, правый увеличивается на переток. Частное округляется вниз, к меньшему целому, в том числе для отрицательных. Каков левый уровень в конце?", "answer": "10", "error": ""}, {"id": "twos_complement", "kind": "text", "domain": "Дискретная математика", "subtypes": ["decode", "encode", "overflow"], "summary": "дополнительный код (two's complement).", "example": "Дано 5-битное число в дополнительном коде (two's complement): 11111. Какому знаковому десятичному числу оно соответствует?", "answer": "-1", "error": ""}, {"id": "ucb_bandit", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["reward", "arm"], "summary": "целочисленный выбор руки.", "example": "Рук 3, ходов 5. Награды каждой руки по порядку её собственных ходов: 1: 1, 4, 4, 1, 2; 2: 4, 3, 4, 0, 4; 3: 0, 3, 2, 4, 1. Сначала руки берутся по номерам, по одному разу. Дальше выбирается рука с наибольшим отношением (сумма её наград + число уже сделанных ходов) / число её ходов. При равенстве берётся меньший номер. Какова сумма полученных наград?", "answer": "12", "error": ""}, {"id": "ulam_walk", "kind": "text", "domain": "Геометрия", "subtypes": ["x", "manhattan"], "summary": "квадратная спираль на клетчатой плоскости.", "example": "Точка начинает в (0, 0). Спираль идёт на восток, затем на север, затем две клетки на запад, две на юг, потом ноги становятся длиннее на 1 каждые два поворота. Восток увеличивает x, север увеличивает y. Какова координата x после 4 шагов?", "answer": "-1", "error": ""}, {"id": "uncertainty_principle", "kind": "text", "domain": "Квантовая физика", "subtypes": ["position_momentum", "energy_time", "atom_size"], "summary": "Задачи на принцип неопределённости Гейзенберга.", "example": "Решите задачу на принцип неопределённости Гейзенберга. Положение электрона определено с точностью Δx = 0.246 нм. Найдите минимальную неопределённость импульса.", "answer": "Ответ: Δp ≥ 2.1443e-25 кг·м/с", "error": ""}, {"id": "undo_reg", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["value", "depth"], "summary": "регистр с отменой.", "example": "Регистр начинает с нуля, стопка отмены пуста. Команд 4: записать 4; записать 3; записать 8; записать 2. Запись кладёт текущее значение в стопку и ставит новое. Отмена достаёт верх стопки в регистр. Пустая стопка отмену игнорирует. Каково конечное значение регистра?", "answer": "2", "error": ""}, {"id": "unification", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["unifiable", "result_term"], "summary": "Унификация термов первого порядка.", "example": "Даны два терма первого порядка (заглавные буквы — переменные, строчные — константы, f/g/h/k — функции): t1 = h(k(f(e, a)), k(X)) t2 = h(k(f(Z, Y)), k(b)) Унифицируемы ли они? (да/нет)", "answer": "да", "error": ""}, {"id": "union_count", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["parts", "joined"], "summary": "объединение элементов в группы.", "example": "Элементов 4, номера от 0 до 4 минус 1. Сначала каждый элемент в своей группе. Связей 4: 1 1; 2 3; 0 0; 3 2. Связь сливает группы двух элементов. Если они уже в одной группе, ничего не меняется. Сколько групп останется?", "answer": "3", "error": ""}, {"id": "union_find", "kind": "text", "domain": "Дискретная математика", "subtypes": ["components", "same", "size"], "summary": "система непересекающихся множеств.", "example": "Есть вершины 1..7, изначально каждая в своей компоненте. Выполнены объединения: 2-5, 5-2, 3-5, 4-6, 5-1. Повторное объединение уже связанных вершин ничего не меняет. Сколько компонент связности получилось?", "answer": "3", "error": ""}, {"id": "unit_conversion", "kind": "text", "domain": "Измерения", "subtypes": ["simple", "compound", "derived"], "summary": "Задачи на перевод единиц измерения.", "example": "Выполните перевод единиц измерения. Переведите 593.05 т в кг.", "answer": "Ответ: 593.05 т = 593050 кг", "error": ""}, {"id": "unit_mod", "kind": "text", "domain": "Абстрактная алгебра", "subtypes": ["units", "product"], "summary": "единицы кольца вычетов и их произведение.", "example": "Кольцо вычетов по модулю 5. Рассматриваются остатки от 1 до 5 без самого модуля. Остаток является единицей, если его наибольший общий делитель с модулем равен 1. Сколько единиц?", "answer": "4", "error": ""}, {"id": "unit_prop", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["bit", "trues"], "summary": "вывод по однопосылочным импликациям.", "example": "Атомы от 1 до 4. Сначала атом 1 равен 0. Дальше правила вида a=u->b=v: если атом a уже равен u, атом b становится равен v. Если a неизвестен или равен другому биту, b не выводится. Неизвестный бит в ответе кодируйте числом 2. Правила по порядку: 1=1->2=1, 1=0->3=1, 2=0->4=0. Чему равен атом 4?", "answer": "2", "error": ""}, {"id": "univariate_regression", "kind": "text", "domain": "Машинное обучение", "subtypes": ["slope", "intercept"], "summary": "МНК для прямой y = a + b x.", "example": "Метод наименьших квадратов для прямой y = a + b*x. Точки: (-1, 3), (-2, -3), (3, -4), (0, 3). Найдите наклон b. Ответ — целое или несократимая дробь.", "answer": "-9/14", "error": ""}, {"id": "until_line", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["count", "here"], "summary": "временной оператор «пока не».", "example": "Миры от 1 до 4. Атом p: 0, 0, 1, 1. Атом q: 0, 0, 1, 1. Формула «p пока не q» в мире i истинна, если правее или в самом i есть мир с q, а во всех мирах строго между ними p истинен. Если раньше встретился мир без p и без q, формула ложна. В скольких мирах формула истинна?", "answer": "2", "error": ""}, {"id": "upwind_row", "kind": "text", "domain": "Гидростатика", "subtypes": ["kept", "lost"], "summary": "перенос значений на одну клетку вправо.", "example": "В ряду 4 чисел слева направо: 1, 4, 4, 1. Тактов 4. За такт каждое число переходит на одну клетку вправо. Правое число покидает ряд. Левая клетка становится 0. Какова сумма чисел, ещё оставшихся в ряду?", "answer": "0", "error": ""}, {"id": "urn_probability", "kind": "text", "domain": "Вероятность", "subtypes": [], "summary": "Базовый класс для всех типов задач (не только математических).", "example": "У нас есть 2 мешок. В каждом мешок лежат камушек разных цветов: мешок №1 (всего 4 камушек): чёрный=3, красный=1 мешок №2 (всего 8 камушек): чёрный=3, красный=1, зелёный=4 Выбираем один мешок случайно (равновероятно), затем извлекаем 3 камушек (без возвращения). Вопрос: ровно 3 из 3 камушек будут красный", "answer": "Итоговая вероятность события: 0.0000", "error": ""}, {"id": "vector_3d", "kind": "text", "domain": "Геометрия", "subtypes": ["cross_product", "triple_scalar", "plane_equation", "distance_point_plane", "angle_vectors", "projection", "parallelpiped_volume"], "summary": "задачи по векторной алгебре в 3D.", "example": "Найдите векторное произведение a⃗ × b⃗, где a⃗ = (-2, 4, 3) и b⃗ = (-3, 0, 4)", "answer": "(16, -1, 12)", "error": ""}, {"id": "velocity_addition", "kind": "text", "domain": "Относительность", "subtypes": ["collinear"], "summary": "релятивистское сложение коллинеарных скоростей.", "example": "В системе K объект движется со скоростью u' = 0.37·c, а система K' движется относительно K со скоростью v = 0.22·c (сонаправленно). Найдите скорость объекта в K (в долях c).", "answer": "0.545589·c", "error": ""}, {"id": "venn_diagram", "kind": "visual", "domain": "Визуальные", "subtypes": ["intersection", "union", "only_a", "sym_diff"], "summary": "Диаграммы Венна (визуальная задача, matplotlib).", "example": "На диаграмме Венна показаны два множества A и B; числа расставлены по областям (числа вне кругов — вне обоих множеств). сколько элементов в пересечении A ∩ B (в общей области)?", "answer": "3", "error": ""}, {"id": "verlet_push", "kind": "text", "domain": "Механика", "subtypes": ["place", "speed"], "summary": "скоростной Верле с чётным ускорением.", "example": "Координата начинает с 1, скорость с 2. Ускорений 4, все чётные: -2, 2, 4, -4. Схема Верле на такте прибавляет к скорости половину ускорения, затем прибавляет скорость к координате, затем снова прибавляет к скорости половину ускорения. Какова координата в конце?", "answer": "11", "error": ""}, {"id": "vieta", "kind": "text", "domain": "Алгебра", "subtypes": [], "summary": "формулы Виета: связь корней и коэффициентов многочлена.", "example": "Найдите сумму корней многочлена P(x) = x^2 + x - 12.", "answer": "-1", "error": ""}, {"id": "voltage_divider", "kind": "text", "domain": "Электричество", "subtypes": ["total", "part"], "summary": "последовательная цепочка резисторов.", "example": "Последовательно соединены 3 резисторов. 1) 4 Ом. 2) 3 Ом. 3) 6 Ом. Ток в цепи 5 А. Найдите общее напряжение в вольтах.", "answer": "65", "error": ""}, {"id": "vtrace", "kind": "text", "domain": "Обучение с подкреплением", "subtypes": ["rho", "target"], "summary": "один шаг V-trace.", "example": "Один шаг V-trace. π/μ = 2/5, порог ρ̄ = 1. ρ = min(ρ̄, π/μ). Цель = V + ρ * (r + γ * V' - V). r = 2, γ = 1, V = 4, V' = 3. Ответ — целое или несократимая дробь. Найдите ρ.", "answer": "2/5", "error": ""}, {"id": "walk_range", "kind": "text", "domain": "Дискретная математика", "subtypes": ["final", "lowest"], "summary": "блуждание шагами +1 и -1.", "example": "Точка стартует на высоте 0 и делает 4 шагов: -1 -1 +1 +1. Найдите итоговую высоту.", "answer": "0", "error": ""}, {"id": "water_jug", "kind": "text", "domain": "Планирование", "subtypes": [], "summary": "Генерирует и решает задачу о кувшинах с водой.", "example": "type: structured_text_with_tags Описание: Решите задачу о кувшинах с водой. Используя кувшины заданных объёмов, отмерьте ровно нужное количество воды. Доступные операции: наполнить, опустошить, перелить. Формат ответа: <reasoning> (Стратегия и анализ) </reasoning> <answer> (Последовательность действий) </answer> Даны кувшины объёмом 4, 7 литров. Начальное состояние: все кувшины пусты. Источник воды неограничен. Цель: отмерить ровно 5 литров воды. Найдите последовательность действий.", "answer": "Решение за 8 шагов:\nШаг 1: Наполнить кувшин 1 (4 л). Состояние: J1=4л, J2=0л.\nШаг 2: Перелить из кувшина 1 в кувшин 2. С", "error": ""}, {"id": "wave_relation", "kind": "text", "domain": "Волны и оптика", "subtypes": ["speed", "frequency", "wavelength"], "summary": "связь скорости, частоты и длины волны.", "example": "Для волны v = f * λ. Частота f = 4, длина волны λ = 3. Найдите скорость v.", "answer": "12", "error": ""}, {"id": "wave_row", "kind": "text", "domain": "Волны и оптика", "subtypes": ["cell", "energy"], "summary": "явная схема волнового уравнения на струне.", "example": "Струна отпущена из покоя, начальная форма 0 0 2 0 0 0. Предыдущая форма совпадает с начальной, концы остаются нулями. Новый сдвиг внутренней точки равен левому соседу плюс правому соседу минус её предыдущий сдвиг. После 3 шагов каков сдвиг точки 4? Точки нумеруются с 1.", "answer": "2", "error": ""}, {"id": "waves", "kind": "text", "domain": "Волны и оптика", "subtypes": ["wavelength", "frequency", "period", "sound_speed", "doppler"], "summary": "задачи на волны.", "example": "Волна с частотой 3998 Гц распространяется со скоростью 328 м/с. Найдите длину волны.", "answer": "0.082 м", "error": ""}, {"id": "weighing_trace", "kind": "text", "domain": "Механика", "subtypes": ["heavy", "tipped"], "summary": "поиск тяжёлой монеты по протоколу весов.", "example": "Подозреваемые монеты: 1, 2, 3, 4. Ровно одна тяжелее остальных, остальные весят как эталон. Каждое из 3 взвешиваний сравнивает одну монету с эталоном. Если монета тяжелее, тяжёлая найдена. Если весы в равновесии, эта монета настоящая. Протокол: 1: монета 3 тяжелее эталона; 2: монета 1 в равновесии; 3: монета 4 в равновесии. Какой номер у тяжёлой монеты?", "answer": "3", "error": ""}, {"id": "weight_decay", "kind": "text", "domain": "Машинное обучение", "subtypes": ["weight", "decay"], "summary": "шаг с целочисленным затуханием веса.", "example": "Вес начинает с -2. Градиентов 4: 4, 3, -3, 0. На шаге затухание — целая часть половины текущего веса, округление вниз. Новый вес равен старому минус градиент минус затухание. Каков конечный вес?", "answer": "1", "error": ""}, {"id": "weighted_interval", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["profit"], "summary": "взвешенное расписание интервалов.", "example": "Работы заданы тройками (начало, конец, прибыль): (3, 12, 3), (5, 10, 8), (10, 11, 10), (0, 8, 5). Две работы совместимы, если конец одной не позже начала другой. Найдите максимальную суммарную прибыль.", "answer": "18", "error": ""}, {"id": "weighted_shortest_path", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": [], "summary": "Графовые алгоритмы как задачи с пошаговым решением.", "example": "Взвешенный неориентированный граф (вершины 0..4). Рёбра: (2-0, weight 1), (3-2, weight 5), (4-3, weight 4), (1-2, weight 8), (4-3, weight 7), (1-4, weight 3), (4-3, weight 1), (0-1, weight 1), (2-0, weight 5). Найдите вес кратчайшего пути между вершинами 3 и 4.", "answer": "1", "error": ""}, {"id": "wheatstone_bridge", "kind": "text", "domain": "Электричество", "subtypes": ["unknown_resistance", "output_voltage"], "summary": "мост Уитстона: баланс и напряжение разбаланса.", "example": "Мост Уитстона сбалансирован: R1 = 131 Ом, R2 = 313 Ом, R3 = 288 Ом. При балансе R1/R2 = R3/Rx. Найдите неизвестное сопротивление Rx (в Ом).", "answer": "Rx = 688.122 Ом", "error": ""}, {"id": "wiener_index", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["sum"], "summary": "индекс Винера связного неориентированного графа.", "example": "Связный неориентированный граф, вершины 1..5, рёбра: 1-2, 1-3, 1-5, 2-4, 4-5. Найдите индекс Винера: сумму расстояний по всем неупорядоченным парам вершин.", "answer": "16", "error": ""}, {"id": "window_distinct", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["total", "at_k"], "summary": "число различных значений в каждом окне.", "example": "Числа слева направо: 1, 1, 2, 3. Окно длины 2 едет слева направо с шагом 1. Всего окон 3. Какова сумма чисел различных значений по всем окнам?", "answer": "5", "error": ""}, {"id": "window_max", "kind": "text", "domain": "Логика и алгоритмы", "subtypes": ["total", "changes"], "summary": "максимумы скользящего окна.", "example": "Массив из 5 чисел: -2, 4, 3, -3, 0. Окно ширины 2 едет слева направо на одну позицию. Найдите сумму максимумов всех окон.", "answer": "11", "error": ""}, {"id": "wire_force", "kind": "text", "domain": "Магнетизм", age"], ["dfa_simulation", "dfa_image"], ["pv_cycle", "pv_cycle_image"], ["grid_navigation", "grid_navigation_image"]]}]};
const tasks = DATA.tasks;
let domain = "Все";
let query = "";

const domains = ["Все", ...Array.from(new Set(tasks.map(t => t.domain))).sort((a, b) => a.localeCompare(b, "ru"))];

function chip(label, on, fn) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.type = "button";
  b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}

function drawChips() {
  const box = document.getElementById("chips");
  box.innerHTML = "";
  for (const name of domains) {
    const n = name === "Все" ? tasks.length : tasks.filter(t => t.domain === name).length;
    box.appendChild(chip(name + " " + n, domain === name, () => { domain = name; query = ""; document.getElementById("q").value = ""; draw(); }));
  }
}

function drawFamilies() {
  const root = document.getElementById("families");
  root.innerHTML = "";
  const h = document.createElement("h2");
  h.textContent = "Где темы сходятся";
  const p = document.createElement("p");
  p.textContent = DATA.families[0].note;
  root.appendChild(h);
  root.appendChild(p);
  for (const group of DATA.families[0].groups) {
    const row = document.createElement("div");
    row.className = "group";
    for (const id of group) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "linkish";
      b.textContent = id;
      b.addEventListener("click", () => {
        query = id;
        domain = "Все";
        document.getElementById("q").value = id;
        draw();
        document.getElementById("list").scrollIntoView({behavior: "smooth", block: "start"});
      });
      row.appendChild(b);
    }
    root.appendChild(row);
  }
}

function visible() {
  const q = query.trim().toLowerCase();
  return tasks.filter(t => {
    if (domain !== "Все" && t.domain !== domain) return false;
    if (!q) return true;
    const blob = [t.id, t.domain, t.summary, t.example, (t.subtypes || []).join(" ")].join("\n").toLowerCase();
    return blob.includes(q);
  });
}

function card(t) {
  const el = document.createElement("article");
  const top = document.createElement("div");
  top.className = "top";
  const id = document.createElement("code");
  id.className = "id";
  id.textContent = t.id;
  top.appendChild(id);
  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = t.domain;
  top.appendChild(tag);
  const kind = document.createElement("span");
  kind.className = "tag" + (t.kind === "visual" ? " visual" : "");
  kind.textContent = t.kind === "visual" ? "картинка" : "текст";
  top.appendChild(kind);
  el.appendChild(top);
  if (t.summary) {
    const s = document.createElement("p");
    s.className = "sum";
    s.textContent = t.summary;
    el.appendChild(s);
  }
  const ex = document.createElement("p");
  ex.className = "ex";
  ex.textContent = t.example || t.error || "Пример условия на этом проходе не собрался.";
  el.appendChild(ex);
  const meta = document.createElement("p");
  meta.className = "meta";
  const bits = [];
  if (t.subtypes && t.subtypes.length) bits.push("Подтипы: " + t.subtypes.join(", "));
  if (t.answer) bits.push("Пример ответа: " + t.answer);
  meta.textContent = bits.join(" · ");
  if (bits.length) el.appendChild(meta);
  return el;
}

function draw() {
  drawChips();
  const rows = visible();
  document.getElementById("countline").textContent = "Показано " + rows.length + " из " + tasks.length;
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!rows.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Ничего не нашлось.";
    list.appendChild(p);
    return;
  }
  for (const t of rows) list.appendChild(card(t));
}

document.getElementById("q").addEventListener("input", (e) => { query = e.target.value; draw(); });
drawFamilies();
draw();
</script>
</body>
</html>
